# LTI AI Grader CGI configuration.
#
# Put the limit_req_zone directives in the http{} context (normally nginx.conf
# or before the server{} block in a file included from http{}). Put the two
# location blocks inside the HTTPS server{} that serves the grader.

# --- http{} context ----------------------------------------------------------
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=lti_receiver:10m rate=60r/m;
limit_req_status 429;

# --- HTTPS server{} context --------------------------------------------------

# LTI launch receiver: isolated FastCGI pool so slow AI grading cannot block
# the next LTI activity launch.
location = /cgi-bin/lti-receiver.py {
    limit_req zone=lti_receiver burst=20 nodelay;

    fastcgi_buffering off;
    gzip off;

    alias /usr/lib/cgi-bin/lti-receiver.py;
    fastcgi_pass unix:/run/fcgiwrap-receiver.socket;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/lti-receiver.py;

    # The receiver only creates the LTI session and redirects the browser.
    fastcgi_read_timeout 15s;
    fastcgi_send_timeout 15s;

    client_max_body_size 2M;

    limit_except GET POST {
        deny all;
    }
}

# General CGI pool used by AI evaluator scripts.
location /cgi-bin/ {
    limit_req zone=mylimit burst=3 nodelay;

    fastcgi_buffering off;
    gzip off;

    alias /usr/lib/cgi-bin/;
    fastcgi_pass unix:/var/run/fcgiwrap.socket;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;

    # Reasoning models can occasionally need more than two minutes.
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;

    client_max_body_size 2M;

    limit_except GET POST {
        deny all;
    }
}
